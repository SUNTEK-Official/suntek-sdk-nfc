<BODY id="bodyId">
 
<center>
<h1>Example Reader Used In Web </h1>
</center>
 
 
<br><br>
 
<center>

<p align="center"><textarea rows="20" id="TxtArea" cols="111"></textarea></p>

<script type="text/javascript" src="interface-v2.js"></script>

<script> 
var msg = document.getElementById('TxtArea');
</script>

<script>

 var hasCard =false;
 var isComOpen=false;
 var icdev= -1;
 var gl_fFailedShow = 0;
 var gl_linkTimerOpened = 0;
 var gl_linkInterval;

var obj = new SmartReader(READER_TYPE._reader_type_compro);
//To capture what time the driver is ready
document.addEventListener('webReaderServerNotifyEvent', function(event){
    console.log(event.detail.message);
    alert("Server is ready, you can start now!");
    Connect();
});


//Link Reader
function Connect()
{
	try{
		if(isComOpen==false)          //if reader link failed
		{
            obj.initialcom(100, 115200).then((rData) => {
			    var opst;
			    var rel = rData.RePara_Int;
			    if(0 == rel)
			    {
				    var hdev = parseInt(rData.RePara_Str);
				    if(hdev != -1)
				    {
					    if(1 == gl_linkTimerOpened)clearInterval(gl_linkInterval);
					    icdev= hdev;
					
					    if(isComOpen == true)
						    return;

					    isComOpen=true;             //Set reader link status
			
					    //msg.value =msg.value+"Link reader ok\n";
					
					    Findcard();
				    }
				    else
				    {
					    if(0 == gl_fFailedShow)
					    {
					      gl_fFailedShow = 1;//set the flag whether show fail message or not
					      msg.value = "Link reader error\n";
					    }
					    //isComOpen=false;           //Set reader link failed status
					    if(0 == gl_linkTimerOpened)
					    {
						    gl_linkInterval = setInterval("Connect()", 30000);//3000);
						    gl_linkTimerOpened = 1;//Set flag
					    }
						
				    }
			    }
			    else
				    msg.value = "Initialcom error\n";

            }).catch((error) => {
                console.log('initialcom catch fail->' + error);
            });
		}
	}catch(e){alert(e.message);}

}

// Find card
function Findcard()
{

    obj.request_b(icdev,
        0,//find mode, 0-single mode, 1-all mode
        0,//application id, alway set to 0
        0)//channal number, set to 0
        .then((rData) => {

		var strcard= rData.RePara_Str;
			
		if(strcard!="")
		{
			if(hasCard == false)
			{
				hasCard =true;
				msg.value=msg.value+"PUPI(4)+APP(4)+PROTOCOL(3): "+strcard+"\n";
        
                obj.beep(icdev, 10).then((rData) => {

			        GetCardID();
      
                }).catch((error) => {
                    console.log('exit catch fail->' + error);
                });
			}
			else
			{
				Disconnect();
			}

		}
		else
		{
			if(0 == gl_fFailedShow)
			{
				gl_fFailedShow = 1;//set the flag whether show fail message or not
				msg.value=msg.value+"Found no card, put a card on the RF area now\n";
			}
				
			hasCard =false;        //Set no card status
				
			Disconnect();

		}
    }).catch((error) => {
        console.log('request_b catch fail->' + error);
    });
}

function GetCardID()
{
  var atrCmd="0036000008";
  var cmdLen = 5;
  
    obj.CommandLink_at(icdev,cmdLen,atrCmd).then((rData) => {
	    var strRedata = rData.RePara_Str;
		  
	    if(strRedata != "")
	    {//apdu command ok
	        msg.value=msg.value+"UID: "+strRedata+"\n";
	    }
	    //else msg.value= msg.value+"Apdu failed \n";
	    Disconnect();//close port and exit
    }).catch((error) => {
        console.log('exit catch fail->' + error);
    });
  
}

//Disconnect with reader
function Disconnect()
{
    obj.exit(icdev).then((rData) => {
        isComOpen=false; //Set unlink status
        Connect();
    }).catch((error) => {
        console.log('exit catch fail->' + error);
    });
}

</script>
