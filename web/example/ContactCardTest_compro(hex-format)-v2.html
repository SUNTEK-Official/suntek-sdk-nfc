<script type="text/javascript" src="interface-v2.js"></script>

<script> 
var msg = document.getElementById('TxtArea');
</script>

<script>

 var isComOpen=false; //A flag indicate whether the reader is open or not
 var icdev= -1; //The handle value which band with reader
 var gl_slot = 0; //The slot the card insert. 0-Main slot, 1-PSAM1, 2-PSAM2...
 var gl_romRWLen = 10; //The length of memory in reader for Reading/Writting
 var gl_romRWAddr = 0; //The address of memory in reader for Reading/Writting

var obj = new SmartReader(READER_TYPE._reader_type_compro);
//To capture what time the driver is ready
document.addEventListener('webReaderServerNotifyEvent', function (event) {
    console.log(event.detail.message);
    alert("Server is ready, you can start now!");
});

obj.onResult(function(rData)
{
	switch(rData.FunctionID)
    {
        case FUNCIDS._fid_iccPPS:
		{
			var iRet = rData.RePara_Int;   
			if(iRet == 0)
			{
				msg.value = msg.value + "Do a PPS ok\n";
			}
			else
			{
				msg.value = msg.value + "Do a PPS error\n";
			}
		}
        break;
	}
	
}
);


//Link Reader
function Connect()
{
	try{
	    if(isComOpen==false)          //if reader link failed
	    {
            if(obj != null)
            {
                obj.initialcom(100, 115200).then((rData) => {

                    icdev =parseInt(rData.RePara_Str) 

                    if(icdev != -1)
                    {
                        msg.value =msg.value+"Link reader ok\n";

                        isComOpen = true;

                        //Do a beep
                        obj.beep(icdev, 10).then((rData) => {

                        }).catch((error) => {
                            console.log('beep catch fail->' + error);
                        });
                    }
                    else
                    {
					    msg.value = "Link reader error\n";
					    isComOpen=false;           //Set reader link failed status
                    }

                }).catch((error) => {
                    console.log('initialcom catch fail->' + error);
                });
            }
	    }
	}catch(e){alert(e.message);}
}
function GetVer()
{
    obj.getHW(icdev).then((rData) => {
        msg.value =msg.value+"Version:" + rData.RePara_Str + "\n";
    }).catch((error) => {
        console.log('getHW catch fail->' + error);
    });
}
function SelCard()
{
	var cardType = document.getElementsByName("flexRadioDefault");
    if(cardType[0].checked){
        
        obj.iccSelCardType(icdev, gl_slot, 
        0x03//4442
        ).then((rData) => {
			var rel = rData.RePara_Int;
			if(0 == rel)
			{
                msg.value=msg.value+"Sel card type 4442 ok \n";
			}
			else msg.value=msg.value+"Sel card type error \n";
        }).catch((error) => {
            console.log('iccSelCardType catch fail->' + error);
        });
    }else if(cardType[1].checked){
        obj.iccSelCardType(icdev, gl_slot, 
        0x04//4428
        ).then((rData) => {
			var rel = rData.RePara_Int;
			if(0 == rel)
			{
                msg.value=msg.value+"Sel card type 4428 ok \n";
			}
			else msg.value=msg.value+"Sel card type error \n";
        }).catch((error) => {
            console.log('iccSelCardType catch fail->' + error);
        });
    }else if(cardType[2].checked){
        obj.iccSelCardType(icdev, gl_slot, 
        0x0C//CPU card
        ).then((rData) => {
			var rel = rData.RePara_Int;
			if(0 == rel)
			{
                msg.value=msg.value+"Sel card type iso7816 card ok \n";
			}
			else msg.value=msg.value+"Sel card type error \n";
        }).catch((error) => {
            console.log('iccSelCardType catch fail->' + error);
        });
    }else if(cardType[3].checked){
        obj.iccSelCardType(icdev, gl_slot, 
        0x01//24CXX card
        ).then((rData) => {
			var rel = rData.RePara_Int;
			if(0 == rel)
			{
                msg.value=msg.value+"Sel card type 24CXX card ok \n";
			}
			else msg.value=msg.value+"Sel card type error \n";
        }).catch((error) => {
            console.log('iccSelCardType catch fail->' + error);
        });
    }
}

// Find card
function Findcard()
{
    obj.iccGetCardState(icdev,gl_slot).then((rData) => {
		var rel = rData.RePara_Int;
		if(0 == rel)
		{
            var cardState = parseInt(rData.RePara_Str);

            msg.value=msg.value+"Card state: "+ cardState +"\n";
			if(cardState != 0)
			{
                msg.value=msg.value+"Found card in the slot\n";
			}
			else
			{
				msg.value=msg.value+"Found no card \n";
			}
        }
    }).catch((error) => {
        console.log('iccGetCardState catch fail->' + error);
    });
}
//Read error counter value 
function ReadErrorCounter()
{
    obj.iccReadErrorCounter(icdev,gl_slot).then((rData) => {
		var rel = rData.RePara_Int;
		if(0 == rel)
		{
            var error_counter = parseInt(rData.RePara_Str);

            msg.value=msg.value+"Error Counter Value: "+ error_counter +"\n";
        }
    }).catch((error) => {
        console.log('iccReadErrorCounter catch fail->' + error);
    });
}

//Verify card password
function VerifyPass()
{
    var txt_pass = document.getElementById("txt_pass");
    var strPass= txt_pass.value;
	
    obj.iccVerifyUserPass(icdev, gl_slot, strPass).then((rData) => {
		var rel = rData.RePara_Int;
		if(0 == rel)
		{
            msg.value=msg.value+"Verify password ok \n";
		}
		else msg.value=msg.value+"Verify password error \n";
    }).catch((error) => {
        console.log('iccVerifyUserPass catch fail->' + error);
    });
}

//Read card
function Read()
{
    var txt_rwAddr = document.getElementById("txt_rwAddr");
    var rwAddr = parseInt(txt_rwAddr.value);
    var txt_rwLen = document.getElementById("txt_rwLen");
    var rwLen = parseInt(txt_rwLen.value);

    obj.iccReadMem(icdev,gl_slot, rwAddr, rwLen).then((rData) => {
		var data =  rData.RePara_Str;     
		if(data != "")
		{
			msg.value = msg.value + "Read ok, data: \n" + data + "\n";
		}
		else
		{
			msg.value = msg.value + "Read error\n";
		}
    }).catch((error) => {
        console.log('iccReadMem catch fail->' + error);
    });
}

//Write card
function Write()
{
    var txt_rwAddr = document.getElementById("txt_rwAddr");
    var rwAddr = parseInt(txt_rwAddr.value);
    var txt_dataForW = document.getElementById("txt_dataForW");
    var strData = txt_dataForW.value;
    var strHex;
	
    obj.iccWriteMem(icdev,gl_slot, rwAddr, strData).then((rData) => {
		var iRet = rData.RePara_Int;   
		if(iRet == 0)
		{
			msg.value = msg.value + "Write card ok\n";
		}
		else
		{
			msg.value = msg.value + "Write card error\n";
		}
    }).catch((error) => {
        console.log('iccWriteMem catch fail->' + error);
    });
}

//Disconnect with reader
function Disconnect()
{
    obj.exit(icdev).then((rData) => {
        isComOpen=false; //Set unlink status
        msg.value =msg.value+"Device dislinked\n";
    }).catch((error) => {
        console.log('exit catch fail->' + error);
    });
}

function Changekey()
{
    var txt_pass = document.getElementById("txt_pass");
    var strPass= txt_pass.value;

	
    obj.iccUpdateUserPass(icdev,gl_slot,strPass).then((rData) => {
		var iRet = rData.RePara_Int;

		}
		else
		{
			msg.value = msg.value + "Update password error\n";
		}
    }).catch((error) => {
        console.log('iccUpdateUserPass catch fail->' + error);
    });
}

{

	    if(iRet != "")

		    msg.value = msg.value + "Cpu card reset:" + iRet + "\n";
	    }
	    else
	    {
		    msg.value = msg.value + "Cpu card error\n";

        console.log('iccGetATR catch fail->' + error);

}

function APDU()
{
    var txt_command = document.getElementById("txt_command");

		var iRet = rData.RePara_Str;

		}
		else
		{
			msg.value = msg.value + "Apdu error\n";
		}
    }).catch((error) => {
        console.log('iccAPDU catch fail->' + error);

}

{
	var cpuCardBaud = document.getElementsByName("flexRadioBaud");
    if(cpuCardBaud[0].checked){
        //9600
        obj.iccSetBaud(icdev, gl_slot, 9600).then((rData) => {
			var iRet = rData.RePara_Int;   
			if(iRet == 0)
			{
				msg.value = msg.value + "Set baud ok\n";
			}
			else
			{
				msg.value = msg.value + "Set baud  error\n";
			}
        }).catch((error) => {
            console.log('iccSetBaud catch fail->' + error);
        });
    }else if(cpuCardBaud[1].checked){
        //38400
        obj.iccSetBaud(icdev, gl_slot, 38400).then((rData) => {
			var iRet = rData.RePara_Int;   
			if(iRet == 0)
			{
				msg.value = msg.value + "Set baud ok\n";
			}
			else
			{
				msg.value = msg.value + "Set baud  error\n";
			}
        }).catch((error) => {
            console.log('iccSetBaud catch fail->' + error);
        });
    }
}

function PPS()
{
    obj.iccPPS(icdev, gl_slot, "").then((rData) => { 
		var iRet = rData.RePara_Int;   
		if(iRet == 0)
		{
			msg.value = msg.value + "Do a PPS ok\n";
		}
		else
		{
			msg.value = msg.value + "Do a PPS error\n";
		}
    }).catch((error) => {
        console.log('iccPPS catch fail->' + error);
    });
}

function ClearMessage()
{
	msg.value = "";
}

//"test1" -> "7465737431"
function Hex2Str(ascStr)
{
    if(ascStr=="")
        return "";
    var hexCharCode=[];
    //hexCharCode.push("0x");
    for(var i = 0; i< ascStr.length; i++){
        hexCharCode.push((ascStr.charCodeAt(i)).toString(16));
    }
    return hexCharCode.join("");
}

//"313233"->"123"
function Str2Hex(strHex)
{
   var trimedStr = strHex.trim();
   var rawStr = trimedStr.substr(0, 2).toLowerCase() == "0x"?trimedStr.substr(2):trimedStr;
   var len = rawStr.length;
   if(len % 2 != 0){
    //Encount invalid data
    return "";
   }
   var curCharCode;
   var resultStr = [];
   for(var i =0; i< len; i = i +2 ){
    curCharCode = parseInt(rawStr.substr(i, 2), 16);
    resultStr.push(String.fromCharCode(curCharCode));
   }
   return resultStr.join("");
}
