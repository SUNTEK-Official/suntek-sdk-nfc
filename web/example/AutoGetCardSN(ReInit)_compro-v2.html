<TITLE>Reader Test</TITLE>

<BODY id="bodyId">
 
<center>
<h1>Example Reader Used In Web </h1>
</center>
 
 
<br><br>
 
<center>

<p align="center"><textarea rows="20" id="TxtArea" cols="111"></textarea></p>

<script type="text/javascript" src="interface-v2.js"></script>

<script> 
var msg = document.getElementById('TxtArea');
</script>

<script>
 var hasCard =false; //A flag indicate whether the reader find card
 var isComOpen=false;
 var icdev= -1;
 var gl_fFailedShow = 0;
 var gl_linkTimerOpened = 0;
 var gl_linkInterval;

var obj = new SmartReader(READER_TYPE._reader_type_compro);
//To capture what time the driver is ready
document.addEventListener('webReaderServerNotifyEvent', function(event){
    console.log(event.detail.message);
    alert("Server is ready, you can start now!");
    Connect();
});

//Link Reader
function Connect()
{
	try{
		if(isComOpen==false)          //if reader link failed
		{
            if(obj != null)
            {
                obj.initialcom(100, 115200).then((rData) => {

			        var opst;
			        //var rel = rData.RePara_Int;
			        //if(0 == rel)
			        //{
				        var hdev = parseInt(rData.RePara_Str);
				        if(hdev != -1)
				        {
					        if(1 == gl_linkTimerOpened){clearInterval(gl_linkInterval);msg.value =msg.value+"stop timer\n";gl_linkTimerOpened = 0;}
					        icdev= hdev;
				
					        if(isComOpen == true)
						        return;

					        isComOpen=true;             //Set reader link status

                            obj.reset(icdev, 10).then((rData) => {
			                    var rel = rData.RePara_Int;
			                    if(rel == 0)
			                    {
				                    Findcard();
			                    }
			                    else
			                    {
				                    Disconnect();
			                    }
                            }).catch((error) => {
                                console.log('reset catch fail->' + error);
                            });

				        }
				        else
				        {
					        if(0 == gl_fFailedShow)
					        {
						        gl_fFailedShow = 1;//set the flag whether show fail message or not
						        msg.value = "Link reader error\n";
					        }
					        //isComOpen=false;           //Set reader link failed status
					        if(0 == gl_linkTimerOpened)
					        {
						        msg.value =msg.value+"start timer\n";
						        gl_linkInterval = setInterval("Connect()", 3000);
						        gl_linkTimerOpened = 1;//Set flag
					        }
				        }
			        //}
			        //else
				    //    msg.value = "Object load error\n";

                }).catch((error) => {
                    console.log('initialcom catch fail->' + error);
                });
            }
		}
	}catch(e){alert(e.message);}
}

// Find card
function Findcard()
{
    obj.findCard_ex(icdev,1, 0x80).then((rData) => {
		var strcard= rData.RePara_Str;
		if(strcard!="")
		{
				
			if(hasCard == false)
			{
				hasCard =true;
				msg.value=msg.value+"Card ID: "+strcard+"\n";

                obj.halt(icdev).then((result) => {
 
                    obj.beep(icdev, 10).then((rData) => {
                        Disconnect();
                    }).catch((error) => {
                        console.log('beep catch fail->' + error);
                    });

                }).catch((error) => {
                    console.log('halt catch fail->' + error);
                });
			}
			else
			{
				Disconnect();
			}
				
		}
		else
		{
			if(0 == gl_fFailedShow)
			{
				gl_fFailedShow = 1;//set the flag whether show fail message or not
				msg.value=msg.value+"Found no card, put a card on the RF area now\n";
			}
					
			hasCard =false;        //Set no card status
			Disconnect();
		}
    }).catch((error) => {
        console.log('findCard_ex catch fail->' + error);
    });
}

//Disconnect with reader
function Disconnect()
{
    obj.exit(icdev).then((result) => {
        isComOpen=false; //Set unlink status
        Connect();
    }).catch((error) => {
        console.log('exit catch fail->' + error);
    });
}


</script>

</center>
 
</BODY>
</HTML>
