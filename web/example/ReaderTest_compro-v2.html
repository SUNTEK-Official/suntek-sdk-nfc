////////// Global Parameters  ///////////////////////////////////////////////////
 var isComOpen=false; //A flag indicate whether the reader is open or not

 var gl_BinBlock = 8;//The binary block number for read/write testing
 var gl_valBlock = 9; //The value block number for read/write testing
 var gl_romRWLen = 10; //The length of memory in reader for Reading/Writting
 var gl_romRWAddr = 0; //The address of memory in reader for Reading/Writting

///////// App Code  //////////////////////////////////////////////////////////
var obj = new SmartReader(READER_TYPE._reader_type_compro);

//To capture what time the driver is ready
document.addEventListener('webReaderServerNotifyEvent', function(event){
    console.log(event.detail.message);
    alert("Server is ready, you can start now!");
});

//Link Reader
function Connect()
{
	try{
	    if(isComOpen==false)          //if reader link failed
	    {
            if(obj != null)
            {
                obj.initialcom(100, 115200).then((rData) => {

                    icdev =parseInt(rData.RePara_Str) 

                    if(icdev != -1)
                    {
                        msg.value =msg.value+"Link reader ok\n";

                        isComOpen = true;

                        //Do a beep
                        obj.beep(icdev, 10).then((rData) => {

                        }).catch((error) => {
                            console.log('beep catch fail->' + error);
                        });
                    }
                    else
                    {
					    msg.value = "Link reader error\n";
					    isComOpen=false;           //Set reader link failed status
                    }

                }).catch((error) => {
                    console.log('initialcom catch fail->' + error);
                });
            }
	    }
	}catch(e){alert(e.message);}

}
function GetVer()
{
    obj.getHW(icdev).then((rData) => {

    }).catch((error) => {

    });
}
function ReadROM()
{

    }).catch((error) => {
        console.log('srd_eeprom catch fail->' + error);

}
function WriteROM()
{

// Find card
function Findcard()
{
    obj.findCard_ex(icdev,1, 0x80).then((rData) => {
        var strcard= rData.RePara_Str;
		if(strcard!="")
		{
            msg.value=msg.value+"Card ID: "+strcard+"\n";
		}
		else
		{
			msg.value=msg.value+"Found no card \n";
		}
    }).catch((error) => {
        console.log('findCard_ex catch fail->' + error);
    });


}
//Read card
function Read()
{
    //-------------------------------------------------------------------- Find Card
    obj.findCard_ex(icdev,1, 0x80).then((rData) => {
        var strcard= rData.RePara_Str;
		if(strcard!="")
		{
            //----------------------------------------------------------- Authentication
            obj.authenticationEx(icdev,0,gl_sector,"FFFFFFFFFFFF").then((rData) => {
            
            	var rel = rData.RePara_Int;
			    if(0 == rel)
			    {
                    //-------------------------------------------------- Read Card
                    obj.read(icdev,gl_BinBlock).then((rData) => {
                        var data =  rData.RePara_Str;
			            if(data != "")
			            {
				            msg.value = msg.value + "Read ok, data: \n" + data + "\n";
			            }
			            else
			            {
				            msg.value = msg.value + "Read error\n";
			            }
                    }).catch((error) => {
                        console.log('read catch fail->' + error);
                    });

			    }
			    else msg.value=msg.value+" Authen sector:" + gl_sector +" error \n";

            }).catch((error) => {
            console.log('authenticationEx catch fail->' + error);
            });

		}
		else
		{
			msg.value=msg.value+"Found no card \n";
		}
    }).catch((error) => {
        console.log('findCard_ex catch fail->' + error);
    });
}

function fullRead_authen(sector)
{
    var key = full_getAuthenKey();

    if(sector < 16)
    {
        obj.authenticationEx(icdev,0,sector,key).then((rData) => {
            
            var rel = rData.RePara_Int;
			if(0 == rel)
			{
                fullRead_read(sector * 4);
			}
			else
            {
             msg.value=msg.value+" Authen sector:" + sector +" error \n";
             fullRead_findCard(sector + 1);
            }

        }).catch((error) => {
        console.log('authenticationEx catch fail->' + error);
        });
    }
}
function fullRead_read(block)
{
    if( (block % 4) != 3)//
    {
        obj.read(icdev,block).then((rData) => {
            var data =  rData.RePara_Str;
			if(data != "")

			}
			else

			}

            console.log('read catch fail->' + error);
        });
    }
    else
    {
        fullRead_authen( (block + 1)/4 );//֤һ
    }
}
